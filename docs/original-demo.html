<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>ER diagram</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;600;700&amp;display=swap" rel="stylesheet"><style id="app-css">
:root{
  --paper:#E8EDE9;--grid:#D5DDD7;--grid-strong:#C0CCC4;--card:#FBFCFA;--panel:#F3F6F3;
  --ink:#1C2B3A;--ink-soft:#5B6B77;--rule:#C8D2CB;--accent:#1F6E8C;
  --hl:#F7DF45;--hl-ink:#2B2300;--head-bg:#1C2B3A;--head-fg:#F4F7F4;--danger:#B42318;
  --sans:'Instrument Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#131A20;--grid:#1C252D;--grid-strong:#27323B;--card:#1B242C;--panel:#161E25;
    --ink:#E4EBEF;--ink-soft:#93A3AE;--rule:#2F3B45;--accent:#7CC0DD;
    --hl:#D9BE2A;--hl-ink:#1A1500;--head-bg:#2B3B48;--head-fg:#EEF3F5;--danger:#F08A7E;color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#131A20;--grid:#1C252D;--grid-strong:#27323B;--card:#1B242C;--panel:#161E25;
  --ink:#E4EBEF;--ink-soft:#93A3AE;--rule:#2F3B45;--accent:#7CC0DD;
  --hl:#D9BE2A;--hl-ink:#1A1500;--head-bg:#2B3B48;--head-fg:#EEF3F5;--danger:#F08A7E;color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{height:100%;margin:0;background:var(--panel);color:var(--ink);font:14px/1.45 var(--sans);-webkit-font-smoothing:antialiased}
#app{height:100%;display:flex;flex-direction:column}
.mono{font-family:var(--mono)}
.sans{font-family:var(--sans)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.bar{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--rule);background:var(--panel);flex-wrap:wrap}
.doc-name{font-size:17px;font-weight:600;border:1px solid transparent;background:transparent;border-radius:6px;padding:5px 8px;width:min(26ch,44vw);min-width:10ch}
.doc-name:hover{border-color:var(--rule)}
.doc-name:focus{border-color:var(--accent);background:var(--card)}
.tools{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-left:auto}
.btn{border:1px solid var(--rule);background:var(--card);border-radius:6px;padding:6px 11px;font-size:13px;font-weight:500;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--ink-soft)}
.btn.primary{background:var(--ink);color:var(--card);border-color:var(--ink)}
.btn.small{padding:3px 9px;font-size:12px}
.btn.danger{color:var(--danger)}
.btn[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--card)}
.btn.check.flagged{background:var(--hl);border-color:var(--hl);color:var(--hl-ink);font-weight:600}
.btn.check.clean{color:var(--accent);font-weight:600}
.btn:disabled{opacity:.45;cursor:default}
.dirty{font-size:12px;color:var(--ink-soft)}
.menu{position:relative}
.menu>summary{list-style:none}
.menu>summary::-webkit-details-marker{display:none}
.menu-pop{position:absolute;right:0;top:calc(100% + 6px);z-index:20;background:var(--card);border:1px solid var(--rule);border-radius:8px;padding:5px;min-width:230px;box-shadow:0 8px 24px rgba(20,30,40,.14)}
.menu-pop button{display:block;width:100%;text-align:left;background:none;border:0;border-radius:5px;padding:8px 10px;font-size:13px;cursor:pointer}
.menu-pop button:hover{background:var(--panel)}
.menu-pop small{display:block;color:var(--ink-soft);font-size:11.5px}

.main{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 360px}
.stage{position:relative;overflow:hidden;background:var(--paper);min-height:0}
#svg{display:block;width:100%;height:100%;touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none}
#svg.linking{cursor:crosshair}
#svg .tbl{cursor:move}
#svg.linking .tbl{cursor:pointer}
#svg .rel-hit{cursor:pointer}
.hint{position:absolute;top:12px;left:12px;right:12px;width:fit-content;max-width:calc(100% - 24px);background:var(--ink);color:var(--card);border-radius:6px;padding:7px 11px;font-size:13px;pointer-events:none}
.hint[hidden]{display:none}
.zoom{position:absolute;right:12px;bottom:12px;display:flex;gap:4px}
.zoom .btn{min-width:34px;padding:5px 9px}

.panel{background:var(--panel);border-left:1px solid var(--rule);display:flex;flex-direction:column;min-height:0}
.tabs{display:flex;border-bottom:1px solid var(--rule);padding:0 10px}
.tabs button{background:none;border:0;border-bottom:2px solid transparent;padding:10px 8px 8px;margin-bottom:-1px;cursor:pointer;font-size:13px;font-weight:500;color:var(--ink-soft)}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--ink)}
.panel-body{overflow:auto;padding:16px;flex:1;min-height:0}
.pane-title{font-size:15px;margin:0 0 10px}
.field{display:block;margin-bottom:10px}
.field>span{display:block;font-size:12px;color:var(--ink-soft);margin-bottom:3px}
.field input,.field select,.col input,.dep select{width:100%;border:1px solid var(--rule);background:var(--card);border-radius:5px;padding:6px 8px;font-size:13px}
.field.big input{font-size:15px;font-weight:600}
.sec-head{display:flex;align-items:center;justify-content:space-between;margin:16px 0 6px}
.sec-head h3{font-size:13px;margin:0}
.help{font-size:12px;color:var(--ink-soft);margin:0 0 10px}
.col{border:1px solid var(--rule);border-radius:7px;background:var(--card);padding:8px;margin-bottom:8px}
.col.flagged{box-shadow:inset 4px 0 0 var(--hl);background:color-mix(in srgb,var(--hl) 14%,var(--card))}
.col-row{display:grid;grid-template-columns:minmax(0,1fr) 104px 26px 26px 26px;gap:4px;align-items:center}
.col input{font-family:var(--mono);font-size:12.5px;padding:5px 7px}
.icon{border:1px solid transparent;background:none;border-radius:4px;height:26px;cursor:pointer;color:var(--ink-soft);font-size:13px;padding:0}
.icon:hover:not(:disabled){border-color:var(--rule);color:var(--ink)}
.icon:disabled{opacity:.3;cursor:default}
.flags{display:flex;flex-wrap:wrap;gap:2px 12px;margin-top:6px}
.flags label{font-size:12px;color:var(--ink-soft);display:flex;align-items:center;gap:4px;cursor:pointer}
.flags input{accent-color:var(--accent);margin:0}
.dep{display:flex;align-items:center;gap:8px;margin-top:6px;font-size:12px;color:var(--ink-soft)}
.dep span{white-space:nowrap}
.dep select{padding:3px 6px;font-size:12px;font-family:var(--mono)}
.rel-list{list-style:none;margin:0;padding:0}
.rel-list li{margin-bottom:4px}
.linkish{background:none;border:0;padding:0;color:var(--accent);cursor:pointer;font-family:var(--mono);font-size:12.5px;text-align:left}
.linkish:hover{text-decoration:underline}
.actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:14px}
.actions.end{justify-content:flex-end}
fieldset.side{border:1px solid var(--rule);border-radius:7px;padding:8px 10px 0;margin:0 0 10px}
fieldset.side legend{font-size:12px;font-weight:600;padding:0 4px}
.sentence{font-family:var(--mono);font-size:12.5px;background:var(--card);border:1px solid var(--rule);border-radius:6px;padding:8px 10px;margin:0 0 12px}
.warn{font-size:12.5px;background:color-mix(in srgb,var(--hl) 22%,var(--card));border-left:4px solid var(--hl);padding:8px 10px;border-radius:4px;margin-top:14px}
.warn .btn{margin-top:6px}
.empty h2{font-size:16px;margin:0 0 8px}
.empty p{margin:0 0 10px;font-size:13px;max-width:60ch}
.table-list{list-style:none;margin:0 0 12px;padding:0}
.table-list li{margin-bottom:4px}

.count{font-weight:600;margin:0 0 10px}
.issues{list-style:none;margin:0;padding:0}
.issues li{margin-bottom:8px}
.issue{display:block;width:100%;text-align:left;border:1px solid var(--rule);border-left:4px solid var(--hl);background:var(--card);border-radius:6px;padding:9px 11px;cursor:pointer}
.issue:hover{border-color:var(--ink-soft);border-left-color:var(--hl)}
.issue .tags{display:flex;gap:6px;margin-bottom:4px}
.chip{font-size:10.5px;font-weight:700;padding:1px 6px;border-radius:3px;background:var(--ink);color:var(--card);font-family:var(--mono)}
.chip.maybe{background:none;color:var(--ink-soft);border:1px dashed var(--ink-soft);font-weight:500;font-family:var(--sans)}
.issue strong{display:block;font-size:13px;font-weight:600}
.issue span.fix{display:block;font-size:12px;color:var(--ink-soft);margin-top:3px}
.ok{background:var(--card);border:1px solid var(--rule);border-left:4px solid var(--accent);border-radius:6px;padding:10px 12px}
.ok p{margin:4px 0 0;font-size:12.5px;color:var(--ink-soft)}
.note{font-size:12px;color:var(--ink-soft);margin-top:14px}

dialog{border:1px solid var(--rule);border-radius:10px;background:var(--card);color:var(--ink);padding:0;width:min(560px,calc(100vw - 32px))}
dialog::backdrop{background:rgba(15,22,28,.45)}
.dlg{padding:18px}
.dlg h2{font-size:16px;margin:0 0 6px}
.dlg textarea{width:100%;font-family:var(--mono);font-size:12px;border:1px solid var(--rule);border-radius:6px;background:var(--panel);padding:8px;margin-top:8px;resize:vertical}
.dlg .err{color:var(--danger);font-size:12.5px;min-height:1em;margin:6px 0 0}
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--ink);color:var(--card);padding:8px 14px;border-radius:6px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .18s,transform .18s;max-width:calc(100vw - 32px);z-index:50}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}

@media (max-width:760px){
  .main{grid-template-columns:1fr;grid-template-rows:minmax(260px,52%) minmax(0,1fr)}
  .panel{border-left:0;border-top:1px solid var(--rule)}
  .tools{margin-left:0}
  .doc-name{width:100%}
}
</style></head>
<body>
<div id="app"></div>
<script type="application/json" id="erd-data"></script>
<script id="app-js">
(function(){
'use strict';
var XLSX_URL='https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
var FONTS='https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;600;700&amp;display=swap';
var LS_KEY='erd-sketch-draft-v1';
var HEAD_H=34,ROW_H=24,PAD_X=12,KEY_W=38,MIN_W=190;

function uid(){return Math.random().toString(36).slice(2,9)}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(ch){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]})}
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
function $(s){return document.querySelector(s)}

/* ---------- data ---------- */
function col(name,type,o){return Object.assign({id:uid(),name:name,type:type,pk:false,unique:false,nullable:false,multi:false,dep:''},o||{})}
function sample(){
  var cu={id:uid(),name:'customers',x:40,y:40,columns:[col('customer_id','INT',{pk:true}),col('full_name','VARCHAR(100)'),col('email','VARCHAR(255)',{unique:true}),col('phone_1','VARCHAR(20)',{nullable:true}),col('phone_2','VARCHAR(20)',{nullable:true})]};
  var or={id:uid(),name:'orders',x:380,y:60,columns:[col('order_id','INT',{pk:true}),col('customer_id','INT'),col('customer_email','VARCHAR(255)'),col('order_date','DATE'),col('postcode','VARCHAR(10)'),col('city','VARCHAR(60)')]};
  or.columns[5].dep=or.columns[4].id;
  var pr={id:uid(),name:'products',x:720,y:120,columns:[col('product_id','INT',{pk:true}),col('name','VARCHAR(100)'),col('price','DECIMAL(10,2)')]};
  return {v:1,name:'Shop example',savedAt:0,tables:[cu,or,pr],rels:[
    {id:uid(),from:cu.id,fromCol:cu.columns[0].id,to:or.id,toCol:or.columns[1].id,type:'1:N',label:'places'},
    {id:uid(),from:or.id,fromCol:'',to:pr.id,toCol:'',type:'N:M',label:'contains'}
  ],view:null};
}
function blank(){return {v:1,name:'Untitled diagram',savedAt:0,tables:[],rels:[],view:{x:40,y:40,k:1}}}
function normalize(s){
  if(!s||typeof s!=='object'||!Array.isArray(s.tables))throw new Error('This file has no "tables" list, so it isn\u2019t a diagram from this tool.');
  var tables=s.tables.map(function(t){return {id:String(t.id||uid()),name:String(t.name||'table'),x:+t.x||0,y:+t.y||0,
    columns:(Array.isArray(t.columns)?t.columns:[]).map(function(c){return {id:String(c.id||uid()),name:String(c.name||''),type:String(c.type||''),pk:!!c.pk,unique:!!c.unique,nullable:!!c.nullable,multi:!!c.multi,dep:String(c.dep||'')}})}});
  var ids={};tables.forEach(function(t){ids[t.id]=1});
  var rels=(Array.isArray(s.rels)?s.rels:[]).filter(function(r){return r&&ids[r.from]&&ids[r.to]}).map(function(r){
    return {id:String(r.id||uid()),from:String(r.from),fromCol:String(r.fromCol||''),to:String(r.to),toCol:String(r.toCol||''),type:['1:1','1:N','N:M'].indexOf(r.type)>=0?r.type:'1:N',label:String(r.label||'')}});
  var v=s.view&&isFinite(s.view.k)?{x:+s.view.x||0,y:+s.view.y||0,k:clamp(+s.view.k,.25,2.5)}:null;
  return {v:1,name:String(s.name||'Untitled diagram'),savedAt:+s.savedAt||0,tables:tables,rels:rels,view:v};
}

var embedded=null,draft=null,state,needFit=false,dirty=false;
try{var dEl=document.getElementById('erd-data');var txt=dEl&&dEl.textContent.trim();if(txt)embedded=normalize(JSON.parse(txt))}catch(e){embedded=null}
try{var d=localStorage.getItem(LS_KEY);if(d)draft=JSON.parse(d)}catch(e){draft=null}
var BASE=embedded?embedded.savedAt:0;
try{
  if(draft&&draft.state&&draft.base===BASE){state=normalize(draft.state);dirty=!!draft.dirty}
  else state=embedded||sample();
}catch(e){state=embedded||sample()}
if(!state.view){state.view={x:40,y:40,k:1};needFit=true}

var sel=null,tab='edit',linkMode=false,linkFrom=null,issues=[],issueCols=new Set(),ART=null,DL=null;

function tbl(id){for(var i=0;i<state.tables.length;i++)if(state.tables[i].id===id)return state.tables[i];return null}
function colOf(t,id){if(!t)return null;for(var i=0;i<t.columns.length;i++)if(t.columns[i].id===id)return t.columns[i];return null}
function isFK(t,c){return state.rels.some(function(r){return r.to===t.id&&r.toCol===c.id})}
function keyLabel(t,c){var fk=isFK(t,c);return c.pk&&fk?'PK FK':c.pk?'PK':fk?'FK':''}
function singular(n){n=String(n||'').toLowerCase();return /ies$/.test(n)?n.slice(0,-3)+'y':/ses$/.test(n)?n.slice(0,-2):/s$/.test(n)&&!/ss$/.test(n)?n.slice(0,-1):n}

/* ---------- normalisation checks ---------- */
function analyze(){
  var out=[];
  function add(o){o.id='i'+out.length;out.push(o)}
  state.tables.forEach(function(t){
    var cols=t.columns,T=t.name||'untitled';
    if(!cols.length){add({rule:'Design',sure:true,tableId:t.id,cols:[],msg:T+' has no columns.',fix:'Add at least a key column.'});return}
    var pks=cols.filter(function(c){return c.pk});
    if(!pks.length)add({rule:'1NF',sure:true,tableId:t.id,cols:[],msg:T+' has no primary key.',fix:'Tick \u201cPrimary key\u201d on the column (or columns) that uniquely identify each row.'});
    cols.forEach(function(c){if(c.multi)add({rule:'1NF',sure:true,tableId:t.id,cols:[c.id],msg:T+'.'+c.name+' holds a list of values.',fix:'Move the values into their own table with one row per value and a foreign key back to '+T+'.'})});
    var groups={};
    cols.forEach(function(c){var m=/^(.*?[a-z])[_\-\s]?(\d+)$/i.exec(c.name||'');if(m){var k=m[1].toLowerCase().replace(/[_\-\s]+$/,'');(groups[k]=groups[k]||[]).push(c)}});
    Object.keys(groups).forEach(function(base){var g=groups[base];if(g.length>1)add({rule:'1NF',sure:false,tableId:t.id,cols:g.map(function(c){return c.id}),msg:g.map(function(c){return c.name}).join(', ')+' look like a repeating group in '+T+'.',fix:'Create a '+base+' table with one row per value, linked back to '+T+'.'})});
    var depFlag=new Set();
    cols.forEach(function(c){
      if(c.pk||!c.dep)return;var dcol=colOf(t,c.dep);if(!dcol)return;
      if(dcol.pk){
        if(pks.length>1){depFlag.add(c.id);add({rule:'2NF',sure:true,tableId:t.id,cols:[c.id,dcol.id],msg:T+'.'+c.name+' depends on '+dcol.name+', which is only part of the key ('+pks.map(function(p){return p.name}).join(' + ')+').',fix:'Move '+c.name+' to a table whose key is '+dcol.name+'.'})}
      }else if(!(dcol.unique&&!dcol.nullable)){
        depFlag.add(c.id);add({rule:'3NF',sure:true,tableId:t.id,cols:[c.id,dcol.id],msg:T+'.'+c.name+' depends on '+dcol.name+', which isn\u2019t a key.',fix:'Move '+c.name+' into a table keyed by '+dcol.name+' and keep just '+dcol.name+' here.'});
      }
    });
    cols.forEach(function(f){
      if(f.pk)return;var m=/^(.+)_id$/i.exec(f.name||'');if(!m)return;var pre=m[1].toLowerCase();
      cols.forEach(function(o){
        if(o===f||o.pk||depFlag.has(o.id)||/_id$/i.test(o.name)||o.name.toLowerCase().indexOf(pre+'_')!==0)return;
        add({rule:'3NF',sure:false,tableId:t.id,cols:[o.id],msg:T+'.'+o.name+' probably describes the '+pre+', not the '+T+' row.',fix:'Keep '+f.name+' and read '+o.name+' from the '+pre+' table instead.'});
      });
    });
  });
  state.rels.forEach(function(r){
    if(r.type!=='N:M')return;var A=tbl(r.from),B=tbl(r.to);if(!A||!B)return;
    add({rule:'Design',sure:true,relId:r.id,tableId:null,cols:[],msg:A.name+' \u2194 '+B.name+' is many-to-many.',fix:'Relational tables can\u2019t hold this directly. Select the relationship to create a junction table.'});
  });
  return out;
}

/* ---------- measuring ---------- */
var mctx=document.createElement('canvas').getContext('2d'),mcache=new Map();
var F_HEAD="600 13px 'Instrument Sans', system-ui, sans-serif",F_COL="600 12px 'JetBrains Mono', ui-monospace, monospace",F_TYPE="11px 'JetBrains Mono', ui-monospace, monospace",F_LBL="600 10.5px 'JetBrains Mono', ui-monospace, monospace";
function measure(text,font){var k=font+'|'+text;var v=mcache.get(k);if(v==null){mctx.font=font;v=mctx.measureText(text).width;mcache.set(k,v)}return v}
function tableWidth(t){
  var w=PAD_X*2+measure(t.name||'untitled',F_HEAD)+34;
  t.columns.forEach(function(c){w=Math.max(w,PAD_X*2+KEY_W+measure(c.name||'?',F_COL)+18+measure(c.type||'',F_TYPE))});
  return Math.ceil(Math.max(MIN_W,w)/2)*2;
}
function tableHeight(t){return HEAD_H+Math.max(1,t.columns.length)*ROW_H}

/* ---------- drawing ---------- */
var SCREEN={paper:'var(--paper)',card:'var(--card)',ink:'var(--ink)',soft:'var(--ink-soft)',rule:'var(--rule)',accent:'var(--accent)',hl:'var(--hl)',hlInk:'var(--hl-ink)',headBg:'var(--head-bg)',headFg:'var(--head-fg)'};
var PRINT={paper:'#FFFFFF',card:'#FFFFFF',ink:'#1C2B3A',soft:'#5B6B77',rule:'#D3DBD5',accent:'#1F6E8C',hl:'#F7DF45',hlInk:'#2B2300',headBg:'#1C2B3A',headFg:'#F4F7F4'};

function tableSVG(t,c,opt){
  var w=tableWidth(t),h=tableHeight(t),n=opt.byTable[t.id]||0,s='';
  s+='<g class="tbl" data-t="'+esc(t.id)+'" transform="translate('+t.x+' '+t.y+')">';
  if(opt.selected||opt.linking)s+='<rect x="-4" y="-4" width="'+(w+8)+'" height="'+(h+8)+'" rx="9" style="fill:none;stroke:'+c.accent+';stroke-width:2'+(opt.linking?';stroke-dasharray:5 4':'')+'"/>';
  s+='<rect width="'+w+'" height="'+h+'" rx="6" style="fill:'+c.card+';stroke:'+c.ink+';stroke-width:1.25"/>';
  s+='<path d="M0 '+HEAD_H+' V6 A6 6 0 0 1 6 0 H'+(w-6)+' A6 6 0 0 1 '+w+' 6 V'+HEAD_H+' Z" style="fill:'+c.headBg+'"/>';
  s+='<text class="sans" x="'+PAD_X+'" y="22" style="fill:'+c.headFg+';font-size:13px;font-weight:600">'+esc(t.name||'untitled')+'</text>';

  var A=tbl(r.from),B=tbl(r.to);if(!A||!B)return null;
  var wa=tableWidth(A),ha=tableHeight(A),wb=tableWidth(B),hb=tableHeight(B),gap=26,pa,pb,ua,ub,c1,c2;
  if(A===B){
    var ya=colY(A,r.fromCol),yb=colY(A,r.toCol);if(ya==null)ya=A.y+HEAD_H/2;if(yb==null||Math.abs(yb-ya)<14)yb=Math.min(A.y+ha-8,ya+Math.max(24,ha/2));
    var x=A.x+wa;pa={x:x,y:ya};pb={x:x,y:yb};ua={x:1,y:0};ub={x:1,y:0};c1={x:x+70,y:ya};c2={x:x+70,y:yb};
  }else if(B.x>=A.x+wa+gap||A.x>=B.x+wb+gap){
    var right=B.x>=A.x+wa+gap,dir=right?1:-1;
    var y1=colY(A,r.fromCol),y2=colY(B,r.toCol);if(y1==null)y1=A.y+ha/2;if(y2==null)y2=B.y+hb/2;
    pa={x:right?A.x+wa:A.x,y:y1};pb={x:right?B.x:B.x+wb,y:y2};ua={x:dir,y:0};ub={x:-dir,y:0};
    var k=Math.max(40,Math.abs(pb.x-pa.x)/2);c1={x:pa.x+dir*k,y:pa.y};c2={x:pb.x-dir*k,y:pb.y};
  }else{

    if(below||A.y>=B.y+hb){var dn=below?1:-1;pa={x:xa,y:below?A.y+ha:A.y};pb={x:xb,y:below?B.y:B.y+hb};ua={x:0,y:dn};ub={x:0,y:-dn};
      var kk=Math.max(30,Math.abs(pb.y-pa.y)/2);c1={x:pa.x,y:pa.y+dn*kk};c2={x:pb.x,y:pb.y-dn*kk};}
    else{pa={x:A.x+wa/2,y:A.y+ha/2};pb={x:B.x+wb/2,y:B.y+hb/2};var dx=pb.x-pa.x,dy=pb.y-pa.y,L=Math.hypot(dx,dy)||1;ua={x:dx/L,y:dy/L};ub={x:-dx/L,y:-dy/L};c1=pa;c2=pb;}

function markD(p,u,kind){

  return 'M'+P(15,0)+'L'+P(0,-8)+'M'+P(15,0)+'L'+P(0,0)+'M'+P(15,0)+'L'+P(0,8)+'M'+P(20,-7)+'L'+P(20,7);

function relSVG(r,c,selected){
  var g=relGeom(r);if(!g)return '';

  var txt=r.type+(r.label?'  '+r.label:''),tw=measure(txt,F_LBL)+14;

  s+='<rect class="rel-hit" x="'+(g.mid.x-tw/2)+'" y="'+(g.mid.y-10)+'" width="'+tw+'" height="20" rx="10" style="fill:'+c.card+';stroke:'+stroke+';stroke-width:1"/>';

function delTable(id){state.tables=state.tables.filter(function(t){return t.id!==id});state.rels=state.rels.filter(function(r){return r.from!==id&&r.to!==id});sel=null;changed({pane:true})}
function delRel(id){state.rels=state.rels.filter(function(r){return r.id!==id});sel=null;changed({pane:true})}
function junction(r){
  var A=tbl(r.from),B=tbl(r.to);if(!A||!B)return;
  var pa=A.columns.find(function(c){return c.pk}),pb=B.columns.find(function(c){return c.pk});
  var na=pa&&pa.name!=='id'?pa.name:singular(A.name)+'_id',nb=pb&&pb.name!=='id'?pb.name:singular(B.name)+'_id';
  if(na===nb){na=singular(A.name)+'_'+na;nb=singular(B.name)+'_'+nb}
  var ca=col(na,pa?pa.type:'INT',{pk:true}),cb=col(nb,pb?pb.type:'INT',{pk:true});
  var wa=tableWidth(A),wb=tableWidth(B);
  var J={id:uid(),name:singular(A.name)+'_'+singular(B.name),x:Math.round(((A.x+wa/2+B.x+wb/2)/2-100)/10)*10,y:Math.round((Math.max(A.y+tableHeight(A),B.y+tableHeight(B))+60)/10)*10,columns:[ca,cb]};
  state.tables.push(J);
  state.rels=state.rels.filter(function(x){return x.id!==r.id});
  state.rels.push({id:uid(),from:A.id,fromCol:pa?pa.id:'',to:J.id,toCol:ca.id,type:'1:N',label:''});
  state.rels.push({id:uid(),from:B.id,fromCol:pb?pb.id:'',to:J.id,toCol:cb.id,type:'1:N',label:''});
  sel={kind:'table',id:J.id};changed({pane:true});toast('Created '+J.name);
}

function onAct(e){
  var b=e.target.closest('[data-act]');if(!b)return;
  var a=b.dataset.act,t=sel&&sel.kind==='table'?tbl(sel.id):null,r=sel&&sel.kind==='rel'?state.rels.find(function(x){return x.id===sel.id}):null;
  var cEl=b.closest('[data-c]'),c=cEl&&t?colOf(t,cEl.dataset.c):null,i=c?t.columns.indexOf(c):-1;

    case 'delCol':t.columns.splice(i,1);t.columns.forEach(function(o){if(o.dep===c.id)o.dep=''});state.rels.forEach(function(x){if(x.fromCol===c.id)x.fromCol='';if(x.toCol===c.id)x.toCol=''});changed({pane:true});break;
    case 'up':if(i>0){t.columns.splice(i-1,0,t.columns.splice(i,1)[0]);changed({pane:true})}break;
    case 'down':if(i<t.columns.length-1){t.columns.splice(i+1,0,t.columns.splice(i,1)[0]);changed({pane:true})}break;
    case 'delTable':arm(b,'Click again to delete',function(){delTable(t.id)});break;

    case 'clear':arm(b,'Click again to clear',function(){var nm=state.name;state=blank();state.name=nm;sel=null;changed({pane:true})});break;
  }

/* ---------- canvas interaction ---------- */
function toWorld(e){var r=svg.getBoundingClientRect(),v=state.view;return {x:(e.clientX-r.left-v.x)/v.k,y:(e.clientY-r.top-v.y)/v.k}}
function zoomAt(cx,cy,f){
  var v=state.view,r=svg.getBoundingClientRect(),px=cx-r.left,py=cy-r.top,k=clamp(v.k*f,.25,2.5);
  var wx=(px-v.x)/v.k,wy=(py-v.y)/v.k;v.k=k;v.x=px-wx*k;v.y=py-wy*k;applyView();saveDraft();
}
function bounds(pad){
  var x1=Infinity,y1=Infinity,x2=-Infinity,y2=-Infinity;
  state.tables.forEach(function(t){var w=tableWidth(t),h=tableHeight(t),self=state.rels.some(function(r){return r.from===t.id&&r.to===t.id});
    x1=Math.min(x1,t.x);y1=Math.min(y1,t.y);x2=Math.max(x2,t.x+w+(self?90:0));y2=Math.max(y2,t.y+h)});
  pad=pad||0;return {x:x1-pad,y:y1-pad,w:x2-x1+pad*2,h:y2-y1+pad*2};
}
function fit(){
  var r=svg.getBoundingClientRect();if(r.width<20||r.height<20)return;
  if(!state.tables.length){state.view={x:40,y:40,k:1};applyView();return}
  var b=bounds(30),k=clamp(Math.min(r.width/b.w,r.height/b.h),.3,1.25);
  state.view={k:k,x:(r.width-b.w*k)/2-b.x*k,y:(r.height-b.h*k)/2-b.y*k};applyView();saveDraft();
}
var drag=null,pointers=new Map();
function pdist(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}
svg.addEventListener('pointerdown',function(e){
  if(e.button>0)return;
  pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
  try{svg.setPointerCapture(e.pointerId)}catch(_){}
  if(pointers.size===2){var p=Array.from(pointers.values());drag={kind:'pinch',d0:pdist(p[0],p[1]),k0:state.view.k};return}
  if(pointers.size>2)return;
  var tg=e.target.closest('[data-t]'),rg=e.target.closest('[data-r]');
  if(tg){
    var t=tbl(tg.dataset.t);if(!t)return;
    if(linkMode){handleLink(t);drag=null;return}
    select('table',t.id);
    var w=toWorld(e);drag={kind:'table',id:t.id,dx:w.x-t.x,dy:w.y-t.y,sx:e.clientX,sy:e.clientY,moved:false};
  }else if(rg){if(!linkMode)select('rel',rg.dataset.r);drag=null}
  else drag={kind:'pan',sx:e.clientX,sy:e.clientY,vx:state.view.x,vy:state.view.y,moved:false};
});
svg.addEventListener('pointermove',function(e){
  if(!pointers.has(e.pointerId))return;pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(!drag)return;
  if(drag.kind==='pinch'){var p=Array.from(pointers.values());if(p.length<2)return;var k=drag.k0*pdist(p[0],p[1])/drag.d0;zoomAt((p[0].x+p[1].x)/2,(p[0].y+p[1].y)/2,k/state.view.k);return}
  if(!drag.moved&&Math.hypot(e.clientX-drag.sx,e.clientY-drag.sy)>3)drag.moved=true;
  if(!drag.moved)return;
  if(drag.kind==='table'){var t=tbl(drag.id),w=toWorld(e);t.x=Math.round((w.x-drag.dx)/10)*10;t.y=Math.round((w.y-drag.dy)/10)*10;renderCanvas()}
  else{state.view.x=drag.vx+e.clientX-drag.sx;state.view.y=drag.vy+e.clientY-drag.sy;applyView()}
});
function endPointer(e){
  pointers.delete(e.pointerId);if(!drag)return;
  if(drag.kind==='pinch'){if(pointers.size<2){drag=null;saveDraft()}return}
  if(drag.kind==='table'&&drag.moved){dirty=true;renderDirty();saveDraft()}
  if(drag.kind==='pan'){if(!drag.moved){if(linkMode)setLink(false);else if(sel)select(null)}else saveDraft()}
  drag=null;
}
svg.addEventListener('pointerup',endPointer);svg.addEventListener('pointercancel',endPointer);
svg.addEventListener('wheel',function(e){e.preventDefault();zoomAt(e.clientX,e.clientY,Math.exp(-e.deltaY*(e.ctrlKey?.01:.0015)))},{passive:false});
document.addEventListener('keydown',function(e){
  var ae=document.activeElement,inField=ae&&/^(INPUT|SELECT|TEXTAREA)$/.test(ae.tagName);
  if(e.key==='Escape'){if(linkMode)setLink(false);else if(!inField&&sel)select(null)}
  if(e.key==='Delete'&&!inField&&sel&&!$('#dlg').open){e.preventDefault();if(sel.kind==='table')delTable(sel.id);else delRel(sel.id)}
});

/* ---------- toast ---------- */
var toastTimer=null;
function toast(msg){var t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(function(){t.classList.remove('show')},2800)}

/* ---------- exports ---------- */
function slug(){return (state.name||'diagram').trim().toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')||'diagram'}
function saveFile(filename,data){
  if(!DL){toast('Downloads aren\u2019t available in this view. Open the published page to export.');return Promise.resolve()}
  return DL.save({filename:filename,data:data}).then(function(){toast('Saved '+filename)}).catch(function(err){
    var c=err&&err.code;if(c==='declined')return;
    if(c==='rate_limited')toast('A save prompt is already open.');
    else if(c==='too_large')toast('That file is too large to save here.');
    else toast('Couldn\u2019t save the file here.');
  });
}
function exportSVGString(){
  var b=bounds(36),titleH=40,W=Math.ceil(b.w),H=Math.ceil(b.h+titleH),ctx=issueCtx();
  var s='<svg xmlns="http://www.w3.org/2000/svg" width="'+W+'" height="'+H+'" viewBox="'+b.x+' '+(b.y-titleH)+' '+W+' '+H+'">';
  s+='<style>.mono{font-family:\'JetBrains Mono\',ui-monospace,Menlo,Consolas,monospace}.sans{font-family:\'Instrument Sans\',system-ui,\'Segoe UI\',Arial,sans-serif}</style>';
  s+='<rect x="'+b.x+'" y="'+(b.y-titleH)+'" width="'+W+'" height="'+H+'" fill="'+PRINT.paper+'"/>';
  s+='<text class="sans" x="'+(b.x+36)+'" y="'+(b.y+4)+'" style="fill:'+PRINT.ink+';font-size:18px;font-weight:700">'+esc(state.name)+'</text>';
  s+=state.rels.map(function(r){return relSVG(r,PRINT,false)}).join('');
  s+=state.tables.map(function(t){return tableSVG(t,PRINT,{byTable:ctx.byTable,cols:ctx.cols})}).join('');
  return s+'</svg>';
}
function exportPNG(){
  var str=exportSVGString(),img=new Image();
  img.onload=function(){
    var sc=2,cv=document.createElement('canvas');cv.width=img.width*sc;cv.height=img.height*sc;
    var g=cv.getContext('2d');g.scale(sc,sc);g.drawImage(img,0,0);
    cv.toBlob(function(bl){if(bl)saveFile(slug()+'.png',bl);else toast('Couldn\u2019t draw the image.')},'image/png');
  };
  img.onerror=function(){toast('Couldn\u2019t draw the image.')};
  img.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(str);
}
function loadXLSX(){
  if(window.XLSX)return Promise.resolve(window.XLSX);
  return new Promise(function(res,rej){var s=document.createElement('script');s.src=XLSX_URL;s.onload=function(){res(window.XLSX)};s.onerror=function(){rej(new Error('load'))};document.head.appendChild(s)});
}
function sheet(X,rows){
  var ws=X.utils.aoa_to_sheet(rows);var n=rows[0].length,w=[];
  for(var i=0;i<n;i++){var m=8;rows.forEach(function(r){m=Math.max(m,String(r[i]==null?'':r[i]).length)});w.push({wch:Math.min(60,m+2)})}
  ws['!cols']=w;if(rows.length>1)ws['!autofilter']={ref:ws['!ref']};return ws;
}
function exportXLSX(){
  toast('Building workbook\u2026');
  loadXLSX().then(function(X){
    var tIss={},cIss={};issues.forEach(function(i){if(i.tableId)(tIss[i.tableId]=tIss[i.tableId]||[]).push(i.rule);i.cols.forEach(function(c){(cIss[c]=cIss[c]||[]).push(i.rule)})});
    var uniq=function(a){return a?Array.from(new Set(a)).join(', '):''};
    var card={'1:1':'One to one','1:N':'One to many','N:M':'Many to many'};
    var wb=X.utils.book_new();
    X.utils.book_append_sheet(wb,sheet(X,[['Item','Value'],['Diagram',state.name],['Exported',new Date().toLocaleString('en-GB')],['Tables',state.tables.length],['Relationships',state.rels.length],['Normalisation issues',issues.length],['Status',issues.length?'Not in 3NF \u2014 see the Normalisation issues sheet':'Passes the 3NF checks']]),'Summary');
    var tr=[['Table','Columns','Primary key','Foreign keys','Issues']];
    state.tables.forEach(function(t){tr.push([t.name,t.columns.length,t.columns.filter(function(c){return c.pk}).map(function(c){return c.name}).join(' + '),t.columns.filter(function(c){return isFK(t,c)}).map(function(c){return c.name}).join(', '),uniq(tIss[t.id])])});
    X.utils.book_append_sheet(wb,sheet(X,tr),'Tables');
    var cr=[['Table','#','Column','Data type','Primary key','Foreign key','References','Unique','Can be empty','Holds a list','Determined by','Issues']];
    state.tables.forEach(function(t){t.columns.forEach(function(c,i){
      var ref=state.rels.find(function(r){return r.to===t.id&&r.toCol===c.id}),refTxt='';
      if(ref){var A=tbl(ref.from),fc=colOf(A,ref.fromCol);refTxt=(A?A.name:'?')+'.'+(fc?fc.name:'?')}
      var dcol=colOf(t,c.dep);
      cr.push([t.name,i+1,c.name,c.type,c.pk?'Yes':'',isFK(t,c)?'Yes':'',refTxt,c.unique?'Yes':'',c.nullable?'Yes':'',c.multi?'Yes':'',c.pk?'':(dcol?dcol.name:'Primary key'),uniq(cIss[c.id])]);
    })});
    X.utils.book_append_sheet(wb,sheet(X,cr),'Columns');
    var rr=[['From table','From column','Cardinality','To table','To column (foreign key)','Label','Reads as']];
    state.rels.forEach(function(r){var A=tbl(r.from),B=tbl(r.to),fc=colOf(A,r.fromCol),tc=colOf(B,r.toCol);rr.push([A?A.name:'',fc?fc.name:'',card[r.type],B?B.name:'',tc?tc.name:'',r.label,sentence(r)])});
    X.utils.book_append_sheet(wb,sheet(X,rr),'Relationships');
    var ir=[['Rule','Certainty','Table','Column(s)','Problem','Suggested fix']];
    issues.forEach(function(i){var t=i.tableId?tbl(i.tableId):null;ir.push([i.rule,i.sure?'Definite':'Possible',t?t.name:(i.relId?relShort(state.rels.find(function(r){return r.id===i.relId})||{}):''),t?i.cols.map(function(c){var x=colOf(t,c);return x?x.name:''}).join(', '):'',i.msg,i.fix])});
    if(ir.length===1)ir.push(['','','','','No problems found','']);
    X.utils.book_append_sheet(wb,sheet(X,ir),'Normalisation issues');
    var buf=X.write(wb,{bookType:'xlsx',type:'array'});
    return saveFile(slug()+'.xlsx',new Blob([buf]));
  }).catch(function(){toast('Couldn\u2019t load the Excel exporter. Check your connection and try again.')});
}
function exportJSON(){
  var txt=JSON.stringify(state,null,2);
  if(DL)return saveFile(slug()+'.json',txt);
  openDlg('copy',txt);
}
$('#exportMenu').addEventListener('click',function(e){
  var b=e.target.closest('[data-exp]');if(!b)return;$('#exportMenu').open=false;

/* ---------- save to link ---------- */
function head(title){return '<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>'+esc(title)+'</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="'+FONTS+'" rel="stylesheet">'}
function buildHtml(){
  var css=document.getElementById('app-css').textContent,js=document.getElementById('app-js').textContent;
  var data=JSON.stringify(state).replace(/</g,'\\u003c');
  var S='<'+'script',E='<'+'/script>';
  return '<!doctype html>\n<html lang="en">\n<head>'+head(state.name)+'<style id="app-css">'+css+'</style></head>\n<body>\n<div id="app"></div>\n'+S+' type="application/json" id="erd-data">'+data+E+'\n'+S+' id="app-js">'+js+E+'\n</body>\n</html>\n';
}
$('#saveBtn').addEventListener('click',function(){
  if(!ART)return;var b=$('#saveBtn');b.disabled=true;b.textContent='Saving\u2026';
  state.savedAt=Date.now();
  ART.publish(buildHtml()).then(function(){toast('Saved. Anyone you share this page with will see this diagram.')}).catch(function(err){
    var c=err&&err.code;b.disabled=false;b.textContent='Save to link';
    if(c==='conflict'){toast('Someone saved a newer version \u2014 loading it now.');return}
    if(c==='not_writer'||c==='not_granted'||c==='not_declared'||c==='capability_disabled'||c==='capability_removed'){b.hidden=true;ART=null;renderDirty();toast('This copy is read-only. Export a diagram file to keep your version.');return}
    if(c==='rate_limited'){toast('Saving too often \u2014 wait a moment and try again.');return}
    if(c==='too_large'){toast('This diagram is too large to save to the page. Export a diagram file instead.');return}
    toast('Couldn\u2019t save just now. Try again in a moment.');
  });
});
